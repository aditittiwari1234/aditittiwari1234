name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          USERNAME = "aditittiwari1234"
          TOKEN = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2026-03-10"
          }

          def github_api(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          user = github_api(
              f"https://api.github.com/users/{USERNAME}"
          )

          repos = []
          page = 1

          while True:
              data = github_api(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          total_stars = sum(
              repo["stargazers_count"]
              for repo in repos
          )

          total_forks = sum(
              repo["forks_count"]
              for repo in repos
          )

          languages = {}

          for repo in repos:
              if repo.get("fork"):
                  continue

              try:
                  repo_languages = github_api(
                      repo["languages_url"]
                  )

                  for language, bytes_count in repo_languages.items():
                      languages[language] = (
                          languages.get(language, 0) + bytes_count
                      )

              except Exception:
                  pass

          total_language_bytes = sum(languages.values())

          language_percentages = []

          if total_language_bytes:
              language_percentages = sorted(
                  [
                      (
                          language,
                          value / total_language_bytes * 100
                      )
                      for language, value in languages.items()
                  ],
                  key=lambda x: x[1],
                  reverse=True
              ]

          os.makedirs("stats", exist_ok=True)

          def esc(value):
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )

          # -----------------------------
          # MAIN STATS SVG
          # -----------------------------

          stats_svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="495" height="220" viewBox="0 0 495 220">
          <rect width="495" height="220" rx="10"
                fill="#161b22"
                stroke="#30363d"/>

          <text x="30" y="45"
                fill="#58a6ff"
                font-size="24"
                font-family="Arial"
                font-weight="bold">
            GitHub Stats
          </text>

          <text x="30" y="82"
                fill="#c9d1d9"
                font-size="18"
                font-family="Arial">
            Repositories
          </text>

          <text x="360" y="82"
                fill="#ffffff"
                font-size="18"
                font-family="Arial"
                text-anchor="end">
            {user["public_repos"]}
          </text>

          <text x="30" y="115"
                fill="#c9d1d9"
                font-size="18"
                font-family="Arial">
            Followers
          </text>

          <text x="360" y="115"
                fill="#ffffff"
                font-size="18"
                font-family="Arial"
                text-anchor="end">
            {user["followers"]}
          </text>

          <text x="30" y="148"
                fill="#c9d1d9"
                font-size="18"
                font-family="Arial">
            Following
          </text>

          <text x="360" y="148"
                fill="#ffffff"
                font-size="18"
                font-family="Arial"
                text-anchor="end">
            {user["following"]}
          </text>

          <text x="30" y="181"
                fill="#c9d1d9"
                font-size="18"
                font-family="Arial">
            Stars
          </text>

          <text x="360" y="181"
                fill="#ffffff"
                font-size="18"
                font-family="Arial"
                text-anchor="end">
            {total_stars}
          </text>

          <text x="30" y="205"
                fill="#8b949e"
                font-size="12"
                font-family="Arial">
            Updated automatically by GitHub Actions
          </text>
          </svg>'''

          with open("stats/stats.svg", "w") as f:
              f.write(stats_svg)

          # -----------------------------
          # LANGUAGES SVG
          # -----------------------------

          rows = language_percentages[:6]

          languages_svg = '''
          <svg xmlns="http://www.w3.org/2000/svg"
          width="495" height="300" viewBox="0 0 495 300">
          <rect width="495" height="300" rx="10"
                fill="#161b22"
                stroke="#30363d"/>

          <text x="30" y="45"
                fill="#58a6ff"
                font-size="24"
                font-family="Arial"
                font-weight="bold">
            Top Languages
          </text>
          '''

          y = 85

          for language, percentage in rows:

              languages_svg += f'''
              <text x="30" y="{y}"
                    fill="#c9d1d9"
                    font-size="16"
                    font-family="Arial">
                {esc(language)}
              </text>

              <rect x="150" y="{y-14}"
                    width="240" height="12"
                    rx="6"
                    fill="#30363d"/>

              <rect x="150" y="{y-14}"
                    width="{240 * percentage / 100}"
                    height="12"
                    rx="6"
                    fill="#58a6ff"/>

              <text x="405" y="{y}"
                    fill="#8b949e"
                    font-size="14"
                    font-family="Arial">
                {percentage:.1f}%
              </text>
              '''

              y += 35

          languages_svg += '''
          </svg>
          '''

          with open("stats/languages.svg", "w") as f:
              f.write(languages_svg)

          # -----------------------------
          # STREAK SVG
          # -----------------------------

          streak_svg = '''
          <svg xmlns="http://www.w3.org/2000/svg"
          width="1000" height="220" viewBox="0 0 1000 220">
          <rect width="1000" height="220" rx="10"
                fill="#161b22"
                stroke="#30363d"/>

          <text x="500" y="45"
                fill="#58a6ff"
                font-size="26"
                font-family="Arial"
                font-weight="bold"
                text-anchor="middle">
            Contribution Activity
          </text>

          <text x="500" y="90"
                fill="#c9d1d9"
                font-size="20"
                font-family="Arial"
                text-anchor="middle">
            {repos_count} public repositories
          </text>

          <text x="500" y="125"
                fill="#c9d1d9"
                font-size="18"
                font-family="Arial"
                text-anchor="middle">
            {stars} total stars • {forks} forks
          </text>

          <text x="500" y="170"
                fill="#8b949e"
                font-size="14"
                font-family="Arial"
                text-anchor="middle">
            Automatically refreshed by GitHub Actions
          </text>
          </svg>
          '''.format(
              repos_count=user["public_repos"],
              stars=total_stars,
              forks=total_forks
          )

          with open("stats/streak.svg", "w") as f:
              f.write(streak_svg)

          print("Stats generated successfully.")
          print(f"Repositories: {user['public_repos']}")
          print(f"Followers: {user['followers']}")
          print(f"Stars: {total_stars}")
          print(f"Forks: {total_forks}")
          print("Languages:", language_percentages[:6])
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats/

          if git diff --cached --quiet; then
            echo "No stats changes."
          else
            git commit -m "Update GitHub profile stats"
            git push
          fi
