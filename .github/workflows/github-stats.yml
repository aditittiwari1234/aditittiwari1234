name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stats

          python3 <<'PY'
          import json
          import os
          import urllib.request

          USERNAME = "aditittiwari1234"
          TOKEN = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def api(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          # Get user information
          user = api(
              f"https://api.github.com/users/{USERNAME}"
          )

          # Get repositories
          repos = []
          page = 1

          while True:
              data = api(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}"
              )

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          # Calculate stars and forks
          stars = sum(
              repo["stargazers_count"]
              for repo in repos
          )

          forks = sum(
              repo["forks_count"]
              for repo in repos
          )

          # Generate main stats SVG
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="500" height="250">

          <rect width="500" height="250"
                rx="12"
                fill="#161b22"
                stroke="#30363d"/>

          <text x="30" y="45"
                fill="#58a6ff"
                font-size="25"
                font-family="Arial"
                font-weight="bold">
            GitHub Stats
          </text>

          <text x="30" y="90"
                fill="#c9d1d9"
                font-size="18"
                font-family="Arial">
            Repositories
          </text>

          <text x="450" y="90"
                fill="#ffffff"
                font-size="18"
                font-family="Arial"
                text-anchor="end">
            {user["public_repos"]}
          </text>

          <text x="30" y="125"
                fill="#c9d1d9"
                font-size="18"
                font-family="Arial">
            Followers
          </text>

          <text x="450" y="125"
                fill="#ffffff"
                font-size="18"
                font-family="Arial"
                text-anchor="end">
            {user["followers"]}
          </text>

          <text x="30" y="160"
                fill="#c9d1d9"
                font-size="18"
                font-family="Arial">
            Following
          </text>

          <text x="450" y="160"
                fill="#ffffff"
                font-size="18"
                font-family="Arial"
                text-anchor="end">
            {user["following"]}
          </text>

          <text x="30" y="195"
                fill="#c9d1d9"
                font-size="18"
                font-family="Arial">
            Stars
          </text>

          <text x="450" y="195"
                fill="#ffffff"
                font-size="18"
                font-family="Arial"
                text-anchor="end">
            {stars}
          </text>

          <text x="30" y="225"
                fill="#8b949e"
                font-size="12"
                font-family="Arial">
            Automatically updated by GitHub Actions
          </text>

          </svg>'''

          with open("stats/stats.svg", "w") as file:
              file.write(svg)

          # Generate activity card
          activity = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="800" height="180">

          <rect width="800" height="180"
                rx="12"
                fill="#161b22"
                stroke="#30363d"/>

          <text x="400" y="50"
                fill="#58a6ff"
                font-size="25"
                font-family="Arial"
                font-weight="bold"
                text-anchor="middle">
            GitHub Activity
          </text>

          <text x="400" y="90"
                fill="#c9d1d9"
                font-size="18"
                font-family="Arial"
                text-anchor="middle">
            {user["public_repos"]} repositories
            • {stars} stars
            • {forks} forks
          </text>

          <text x="400" y="135"
                fill="#8b949e"
                font-size="14"
                font-family="Arial"
                text-anchor="middle">
            Automatically updated every hour
          </text>

          </svg>'''

          with open("stats/streak.svg", "w") as file:
              file.write(activity)

          print("Stats generated successfully!")
          print("Repositories:", user["public_repos"])
          print("Followers:", user["followers"])
          print("Following:", user["following"])
          print("Stars:", stars)
          print("Forks:", forks)

          PY

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update GitHub profile stats"
            git push
          fi
